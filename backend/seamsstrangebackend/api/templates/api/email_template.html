<style>

    html,body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: #0D313A;
        margin: 0;
        padding: 0;

    }

    .card{
        background-color: #367583;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
        border-radius: 2ch;
        margin-left: 5%;
        margin-right: 5%;
        padding-left: 3ch;
        padding-right: 3ch;
        margin-top: 3ch;
        margin-bottom: 3ch;
        
    }

    h1{
        color: #0a7c5a ;
        padding-top: 1ch;
    }

    h2{
        color: #17c783;
        text-align: center;
        overflow-wrap: break-word;
    }

    .context{
        color: white;
        font-size: 75%;
    }

    .header{
        background-color: white;
        text-align: center;
        padding-bottom: 1ch;
    }

    .notificationPill{
        background-color: red;
        padding-left: 1ch;
        padding-right: 1ch;
        padding-top: 0.25ch;
        padding-bottom: 0.25ch;
        border-radius: 1ch;
        color: white;
        box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
    }

    .cardContent{
        padding-top: 1ch;
        padding-bottom: 1ch;
    }

    .emailMessage{
        background-color: white;
        padding-top: 1ch;
        padding-bottom: 1ch;
        border-radius: 1ch;
        padding-right: 1ch;
        padding-left: 1ch;
        overflow-wrap: break-word;
    }

</style>
<div class="header">
    <h1>Seams Strange <span class="notificationPill">Notification 🔔</span></h1>
    <p>You are recieving this email because a new individual has submitted an inquiry:</p>
</div>
<div class="card">
    <div class="cardContent">
        <h2>
        Inquiry From: <span class="context">{{ sent_from }}</span>
        </h2>

        <h2>
            Inquierer Name: <span class="context">{{ name }}</span> 
        </h2>

        <h2>
            Inquierer Email: <span class="context">{{ email }}</span> 
        </h2>

        <h2>Message:</h2>

        <p class="emailMessage">{{ message }}</p>
    </div>
</div>
